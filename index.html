<!doctype html>
<canvas width=512 height=512></canvas>
<script>
function dot(u, v) {
  return u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
}

function normalize(v) {
  const hypot = Math.sqrt(dot(v, v));

  v[0] /= hypot;
  v[1] /= hypot;
  v[2] /= hypot;

  return v;
}

function intersect(eye, ray, sphere) {
  const v = [sphere[0] - eye[0], sphere[1] - eye[1], sphere[2] - eye[2]];
  const b = dot(ray, v);
  const disc = b * b - dot(v, v) + sphere[3] * sphere[3];
  if(disc < 0.0) { return Infinity; }

  const d = Math.sqrt(disc), t2 = b + d, t1 = b - d;
  if(t2 < 0.0) { return Infinity; }
  if(t1 > 0.0) { return t1; }
  return t2;
}

function raytrace(id, eye) {
  const sphere = [0, 0, 0, 1];
  const ray = [0, 0, 0];
  const hit = [0, 0, 0];
  const light = normalize([-1, 0, -1]);

  for(let y = 0, i = 0; y < id.height; y++) {
    for(let x = 0; x < id.width; x++, i += 4) {
      ray[0] = (x * 2 + 1) - id.width;
      ray[1] = (y * 2 + 1) - id.height;
      ray[2] = Math.max(id.width, id.height) * Math.sqrt(3);
      normalize(ray);

      const t = intersect(eye, ray, sphere);
      if(!Number.isFinite(t)) {
        id.data[i + 0] = 0;
        id.data[i + 1] = 0;
        id.data[i + 2] = 0;
        id.data[i + 3] = 0;
        continue;
      }

      hit[0] = (eye[0] + ray[0] * t - sphere[0]) / sphere[3];
      hit[1] = (eye[1] + ray[1] * t - sphere[1]) / sphere[3];
      hit[2] = (eye[2] + ray[2] * t - sphere[2]) / sphere[3];

      // NB: lon and lat scaled from 0=π/6 to 255=5π/6.
      const lon = Math.round((Math.PI*5/6 - Math.atan2(-hit[2], hit[0])) * 255 / (2*Math.PI/3));
      const lat = Math.round((Math.acos(-hit[1]) - Math.PI/6) * 255 / (2*Math.PI/3));
      const brightness = Math.round(Math.max(dot(hit, light), 0) * 255);
      id.data[i + 0] = lon;
      id.data[i + 1] = lat;
      id.data[i + 2] = brightness;
      id.data[i + 3] = 255;
    }
  }
}

function lerp(a, b, t) {
  return a * (1 - t) + b * t;
}

// FIXME: In theory we could use the blue noise texture to jitter nearest
// neighbor lookups, avoiding the interpolation?
function lookup(moon, x, y) {
  const u = Math.floor(x);
  const v = Math.floor(y);
  x -= u;
  y -= v;

  const a = moon[(v + 0) * 512 + ((u + 0) & 511)];
  const b = moon[(v + 0) * 512 + ((u + 1) & 511)];
  const c = moon[(v + 1) * 512 + ((u + 0) & 511)];
  const d = moon[(v + 1) * 512 + ((u + 1) & 511)];
  return lerp(lerp(a, b, x), lerp(c, d, x), y);
}

const lunar_surface = new Image();
lunar_surface.onload = () => {
  const canvas = document.getElementsByTagName("canvas")[0];
  const ctx = canvas.getContext("2d");
  ctx.drawImage(lunar_surface, 0, 0);

  // NB: pre must be at least as big as lunar_surface.
  const pre = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const moon = new Uint8Array(512 * 256);
  for(let y = 0, i = 0; y < 256; y++) {
    for(let x = 0; x < 512; x++, i++) {
      moon[i] = pre.data[(y * pre.width + x) * 4 + 0];
    }
  }

  const blue_noise = new Image();
  blue_noise.onload = () => {
    ctx.drawImage(blue_noise, 0, 0);

    // NB: id must be at least as big as blue_noise.
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const noise = new Uint8Array(64 * 64);
    for(let y = 0, i = 0; y < 64; y++) {
      for(let x = 0; x < 64; x++, i++) {
        noise[i] = id.data[(y * id.width + x) * 4 + 0];
      }
    }

    raytrace(pre, [0, 0, -2]);

    function draw(time_ms) {
      for(let y = 0, i = 0; y < id.height; y++) {
        for(let x = 0; x < id.width; x++, i += 4) {
          if(pre.data[i + 3] === 0) {
            id.data[i + 0] = 0;
            id.data[i + 1] = 0;
            id.data[i + 2] = 0;
            id.data[i + 3] = 255;
            continue;
          }

          const u = lerp(256 / 6, 256 * 5 / 6, pre.data[i + 0] / 255) + (time_ms / 50);
          const v = lerp(256 / 6, 256 * 5 / 6, pre.data[i + 1] / 255);
          const w = pre.data[i + 2] / 255;
          const b = (lookup(moon, u, v) * w > noise[(y & 63) * 64 + (x & 63)]) * 255;
          id.data[i + 0] =
          id.data[i + 1] =
          id.data[i + 2] = b;
          id.data[i + 3] = 255;
        }
      }

      ctx.putImageData(id, 0, 0);

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  };
